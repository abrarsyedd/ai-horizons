version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing dependencies for build stage..."
      - pip install --upgrade pip
      - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
  build:
    commands:
      - echo "Build stage completed. Packaging for deployment..."
artifacts:
  files:
    - '**/*'
  discard-paths: no
  exclude-paths:
    - '.git/*'
    - '.github/*'
    - '__pycache__/*'
    - '*.pyc'
    - 'venv/*'
cache:
  paths:
    - '/root/.cache/pip/**/*'
