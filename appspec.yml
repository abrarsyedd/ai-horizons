version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/ai_horizons
    overwrite: yes

file_exists_behavior: OVERWRITE

permissions:
  - object: /home/ubuntu/ai_horizons
    owner: ubuntu
    group: ubuntu
    mode: 755

hooks:
  BeforeInstall:
    - location: scripts/stop_server.sh
      timeout: 120
      runas: root

  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 1800
      runas: root
    - location: scripts/migrate_db.sh
      timeout: 900
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
